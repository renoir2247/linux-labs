name: CI and Docker Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run ShellCheck linter
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          severity: error
          scandir: "."

      - name: Run unit test
        run: |
          set -euo pipefail
          chmod +x app_calculator.sh
          output=$(./app_calculator.sh 5 10)
          echo "Вывод скрипта: '$output'"
          if ! echo "$output" | grep -q "^Сумма: 15$"; then
            echo "Тест провален: '$output'"
            exit 1
          fi
          echo "Тест успешно пройден!"

  docker-build:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t my-app:${{ github.sha }} .

      - name: Test Docker Container
        run: |
          set -euo pipefail
          docker run -d -p 8080:8080 --name test_app my-app:${{ github.sha }}
          sleep 2
          curl --fail http://localhost:8080 || exit 1
          docker stop test_app && docker rm test_app
